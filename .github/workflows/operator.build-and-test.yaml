name: Build and test Operator
on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'
env:
  WORKING_DIRECTORY: klyshko-operator
jobs:
  changes:
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
    outputs:
      operator: ${{ steps.filter.outputs.operator }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Check whether Operator codebase (w/o chart) is affected
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            operator:
              - '${{ env.WORKING_DIRECTORY }}/!(charts/**)/**'
  operator-test:
    runs-on: ubuntu-22.04
    needs: changes
    if: ${{ needs.changes.outputs.operator == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/go.sum
      - name: Install helm (chart render tests)
        uses: azure/setup-helm@v4
      - name: Unit and property tests with race detector and coverage floor
        working-directory: ${{ env.WORKING_DIRECTORY }}
        # Everything that does not need envtest (the Ginkgo suite in ./controllers is skipped here and run by
        # "make test" below). Floor = coverage measured when introduced (57.6%) minus 2 points.
        run: |
          go test -race -p 2 -skip 'TestControllers' \
            -coverpkg=./controllers/...,./castor/...,./api/... -coverprofile=unit-cover.out \
            ./castor ./api/... ./charts ./controllers
          scripts/check-coverage.sh unit-cover.out 55.5
      - name: Fuzz smoke tests
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          go test ./controllers -skip 'TestControllers' -run '^$' -fuzz '^FuzzParseKey$' -fuzztime 15s
          go test ./controllers -skip 'TestControllers' -run '^$' -fuzz '^FuzzUnmarshalTaskStatus$' -fuzztime 15s
          go test ./controllers -skip 'TestControllers' -run '^$' -fuzz '^FuzzTaskNames$' -fuzztime 15s
          go test ./castor -skip 'TestCastorClient' -run '^$' -fuzz '^FuzzTelemetryJSON$' -fuzztime 15s
      - name: Build and Test
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          make test
      - name: Publishing Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ${{ env.WORKING_DIRECTORY }}/cover.out
          token: ${{ secrets.CODECOV_TOKEN }}
          name: codecov
  # This is required to allow for setting the test job as required in scenarios
  # where the tests are not actually run, e.g., when there are no changes to
  # the relevant codebase
  operator-test-status:
    runs-on: ubuntu-22.04
    needs: operator-test
    if: '!cancelled()' # Makes the job run regardless whether 'operator-test' succeeds or not but allows for cancellation
    steps:
      - name: Tests successful
        if: ${{ !(contains(needs.operator-test.result, 'failure')) }}
        run: exit 0
      - name: Tests failed
        if: ${{ contains(needs.operator-test.result, 'failure') }}
        run: exit 1
